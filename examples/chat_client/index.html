);font:700 10px/1 var(--font-ui);white-space:nowrap}.msg-file-icon:before{content:"";position:absolute;top:0;right:0;width:11px;height:11px;border-left:1px solid var(--accent);border-bottom:1px solid var(--accent);border-radius:0 10px 0 3px}.msg-file-details{display:flex;flex-direction:column;min-width:0}.msg-file-name{overflow-wrap:anywhere}.msg-file-meta{font:12px/1.5 var(--font-ui);opacity:.75}.msg-preview-error{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px;color:var(--ink-soft);font:12px/1.5 var(--font-ui)}.msg-preview-error button{border:1px solid var(--rule);border-radius:6px;padding:3px 7px;background:var(--card);color:var(--ink);cursor:pointer;font:inherit}.composer-chip.file-chip{width:150px}.composer-file-name{padding:8px 22px 8px 8px;font:12px/1.4 var(--font-ui);overflow:hidden;overflow-wrap:anywhere}.conversation-panel{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative;container:conversation / inline-size}.conversation-panel[hidden]{display:none}.actions .layout-switch{display:inline-flex;align-items:center;gap:2px;padding:2px;border:1px solid var(--rule);border-radius:9px;background:var(--paper-deep)}.actions .layout-switch[hidden]{display:none}.actions .layout-switch button{display:grid;place-items:center;width:28px;height:26px;padding:4px;border:0;border-radius:6px;background:transparent;color:var(--ink-soft)}.actions .layout-switch svg{width:16px;height:16px;pointer-events:none;stroke-linecap:round;stroke-linejoin:round}.actions .layout-switch button:hover:not(:disabled){background:var(--accent-soft);color:var(--accent)}.actions .layout-switch button[aria-checked=true]{color:var(--accent-strong);background:var(--card);box-shadow:0 1px 3px var(--shadow-strong)}.actions .layout-switch button:focus-visible{outline:2px solid var(--accent);outline-offset:-1px}.actions .layout-switch button:disabled{opacity:.35;cursor:default}.conversation-panel header h1{display:block}.conversation-panel[data-layout=full]{flex:1}.conversation-panel[data-layout=dock],.conversation-panel[data-layout=float]{padding:0 14px 18px;background:var(--paper);border:1px solid var(--rule);border-radius:14px;box-shadow:0 8px 32px var(--shadow-strong)}.conversation-panel[data-layout=dock]{flex:0 0 34%;margin:14px 0 18px 10px}.conversation-panel[data-layout=float]{position:fixed;z-index:40}.conversation-panel[data-layout=float] footer textarea{max-height:min(120px,20dvh)}.conversation-panel[data-layout=float] .composer-attachments{max-height:96px;overflow-y:auto}header[data-panel-movable]{cursor:grab;touch-action:none}header[data-panel-movable]:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}.conversation-panel.is-adjusting{-webkit-user-select:none;user-select:none}.conversation-panel.is-adjusting header{cursor:grabbing}.conversation-panel header{border-radius:13px 13px 0 0}@container chathead (max-width: 520px){.conversation-panel header .who,.conversation-panel header .sync-status{display:none}.conversation-panel header .actions{margin-left:auto}}@container chathead (max-width: 400px){.conversation-panel header .brand,.conversation-panel header .badge{display:none}}.panel-resize{position:absolute;right:0;bottom:0;display:grid;place-items:center;width:22px;height:22px;padding:2px;border:0;border-radius:5px;background:transparent;color:var(--ink-soft);cursor:nwse-resize;touch-action:none}.panel-resize[hidden]{display:none}.panel-resize svg{width:16px;height:16px;pointer-events:none}.conversation-panel button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}@container conversation (max-width: 520px){.conversation-panel .msg-row{max-width:90%}.conversation-panel .composer-input{min-width:0}.conversation-panel footer textarea{min-width:0}.conversation-panel .composer-row{gap:6px}}body.pip-window{display:flex;height:100dvh}.pip-window .conversation-panel{position:relative;flex:1;width:100%;height:100%;margin:0;border:0;border-radius:0;box-shadow:none}.pip-window .conversation-panel header{border-radius:0}</style>
  </head>
  <body>
    <div class="wrap">
      <aside id="sidebar" class="sidebar" aria-label="历史对话">
        <ul id="sessionList" class="session-list" role="list"></ul>
        <div id="sessionScrollbar" class="session-scrollbar" role="scrollbar" aria-label="会话列表滚动条"
          aria-controls="sessionList" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" tabindex="-1"></div>
        <div class="sidebar-actions">
          <button id="newSessionBtn" class="sidebar-new" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 5v14M5 12h14"/>
            </svg>
            <span>新会话</span>
          </button>
          <button id="dropEntry" class="drop-entry" type="button" hidden aria-label="打开 Drop" title="Drop"
            aria-controls="dropMessages" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m22 2-7 20-4-9-9-4Z"/>
              <path d="M22 2 11 13"/>
            </svg>
          </button>
        </div>
      </aside>
      <div class="sidebar-backdrop" id="sidebarBackdrop" hidden></div>
      <div id="transferStatus" class="transfer-status" role="status" aria-live="polite" hidden></div>

      <div class="main">
        <header id="chatHeader">
          <button id="sidebarToggle" type="button" class="sidebar-toggle"
            aria-label="切换会话列表" aria-controls="sidebar" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 6h18M3 12h18M3 18h18"/>
            </svg>
          </button>
          <a class="brand" href="/" aria-label="返回首页">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
              </svg>
            </span>
          </a>
          <h1 id="brandName">WebChat Gateway</h1>
          <span id="who" class="who" hidden></span>
          <span id="syncStatus" class="badge sync-status" data-state="live" title="同步状态">实时</span>
          <span id="quotaBadge" class="badge">--</span>
          <div class="actions">
            <div id="dropLayoutSwitch" class="layout-switch" role="radiogroup" aria-label="Drop 窗口布局" hidden>
              <button type="button" data-layout="full" role="radio" aria-checked="true" aria-label="默认" title="默认">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/></svg>
              </button>
              <button type="button" data-layout="float" role="radio" aria-checked="false" aria-label="浮窗" title="浮窗" tabindex="-1">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M8 20H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v3"/><rect x="10" y="11" width="11" height="9" rx="1.5"/></svg>
              </button>
              <button type="button" data-layout="dock" role="radio" aria-checked="false" aria-label="右侧栏" title="右侧栏" tabindex="-1">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M14 4v16"/><path d="M17.5 8v8" stroke-opacity=".45"/></svg>
              </button>
            </div>
            <button id="refreshHistory" type="button" class="icon-only refresh-button"
              aria-label="刷新当前对话" title="刷新当前对话">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>
              </svg>
            </button>
            <button id="dropClose" type="button" class="icon-only" aria-label="关闭 Drop，返回对话" title="返回对话" hidden>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
            </button>
            <div id="headerMenu" class="header-menu">
              <button id="headerMenuToggle" type="button" class="icon-only header-menu-trigger"
                aria-label="更多选项" aria-controls="headerMenuPanel" aria-expanded="false" title="更多选项">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/>
                </svg>
              </button>
              <div id="headerMenuPanel" class="header-menu-panel" role="group" aria-label="更多选项" hidden>
                <button id="importConversations" type="button" class="header-menu-item" title="从 JSON 备份导入对话">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M4 16v4h16v-4M12 3v12m-4-4 4 4 4-4"/>
                  </svg>
                  <span>导入对话</span>
                </button>
                <button id="exportConversations" type="button" class="header-menu-item" title="导出全部对话为 JSON，附件不包含在内">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M4 16v4h16v-4M12 15V3m-4 4 4-4 4 4"/>
                  </svg>
                  <span>导出全部对话</span>
                </button>
                <div class="header-menu-separator" role="separator"></div>
                <button id="themeToggle" type="button" class="header-menu-item"
                  aria-label="切换主题" aria-pressed="false">
                  <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                  </svg>
                  <span>切换主题</span>
                </button>
                <button id="logout" type="button" class="header-menu-item danger" title="退出并清除本机保存的 token">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M9 4H5a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h4M15 16l4-4-4-4M19 12H9"/>
                  </svg>
                  <span>登出</span>
                </button>
              </div>
              <input id="conversationImportFile" type="file" accept=".json,application/json" hidden />
            </div>
          </div>
        </header>

        <section id="dropPanel" class="conversation-panel" data-layout="full" aria-label="Drop" hidden>
          <div id="dropMessages" class="message-list" role="log" aria-label="Drop" aria-live="polite" hidden></div>
          <button id="dropResize" class="panel-resize" type="button" aria-label="调整浮窗大小，使用方向键或拖动" title="拖动或使用方向键调整大小" hidden>
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" aria-hidden="true"><path d="m4 12 8-8M8 12l4-4"/></svg>
          </button>
        </section>
        <div id="messages" class="message-list">

          <div id="emptyState" class="empty-state">
            <span class="empty-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
              </svg>
            </span>
            <p class="empty-title">开始一段对话</p>
            <p class="empty-hint">把想法写在下面，按 Enter 发送</p>
          </div>
        </div>

        <footer>
          <div id="composer-attachments" aria-label="附件预览"></div>
          <div id="imgRatioBar" class="ratio-bar" role="radiogroup" aria-label="图片比例" hidden></div>
          <div class="composer-row">
            <div class="composer-input">
              <button id="plusBtn" type="button" class="plus-btn" aria-label="更多功能"
                aria-controls="plusMenu" aria-expanded="false" title="更多功能">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <line x1="12" y1="5" x2="12" y2="19"/>
                  <line x1="5" y1="12" x2="19" y2="12"/>
                </svg>
              </button>
              <div id="plusMenu" class="plus-menu" hidden>
                <button id="menuUpload" type="button" class="plus-menu-item">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21.44 11.05 12.25 20.24a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 1 1-2.83-2.83l8.49-8.48"/>
                  </svg>
                  <span>上传图片</span>
                </button>
                <button id="menuImage" type="button" class="plus-menu-item" aria-pressed="false" hidden>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <polyline points="21 15 16 10 5 21"/>
                  </svg>
                  <span>生成图片</span>
                </button>
              </div>
              <input id="fileInput" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple hidden />
              <textarea id="input" rows="1" placeholder="输入消息…"></textarea>
            </div>
            <button id="send" type="button" data-mode="send" aria-label="发送">
              <span class="send-mode">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="m22 2-7 20-4-9-9-4 20-7Z"/>
                </svg>
                <span>发送</span>
              </span>
              <span class="stop-mode">
                <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                  <rect x="6" y="6" width="12" height="12" rx="2"/>
                </svg>
                <span>停止</span>
              </span>
            </button>
          </div>
          <div id="dropOverlay" class="drop-overlay" hidden aria-hidden="true">
            <div class="drop-overlay-inner">松开以添加图片</div>
          </div>
        </footer>
      </div>
    </div>

  </body>
</html>
